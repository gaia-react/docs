# do-not-document.yml
#
# Exclusion list for source-survey. Items listed here exist in the GAIA source
# at ~/Development/gaia-react/gaia/ but must NEVER appear in public docs at
# ~/Development/gaia-react/docs/src/content/docs/, including under contributors/.
#
# This is distinct from .gaia/release-exclude (path-level shipping rules) and
# from gaia:maintainer-only block markers (block-level shipping rules). Those
# two mechanisms separate adopter docs from contributor docs. THIS file
# additionally blocks contributor docs from documenting deliberately
# obscure surface (obscurity-by-design).
#
# Source-survey treats matched items as EXCLUDED in drift reports rather than
# NEW or REMOVED, so the user knows we're skipping them on purpose.
#
# Schema (one entry per item):
#   - path: <source path or glob; relative to gaia/ root or absolute>
#     reason: <one-line justification>
#     added: <YYYY-MM-DD>
#
# Match semantics:
#   - Paths are matched as glob patterns (fnmatch-style: *, **, ?).
#   - A pattern matches any source surface item whose `path` field starts with
#     the pattern after gaia/ is stripped, OR whose `name` field contains the
#     pattern as a substring (used for CLI subcommand names like _internal-*).
#   - Patterns ending in `/` or containing `**` are directory globs.
#
# Extending this file:
#   - Add new entries with the schema above.
#   - Pre-existing entries below are obscurity-by-design per audit findings in
#     PR #97. Do not remove them without an explicit decision in studio/.

exclusions:
  - path: .gaia/cli/src/mentorship/display-rule.ts
    reason: obscurity-by-design (mentorship display rule contract is protected; documenting it defeats the protection). The mentorship layer is removed in GAIA 2.0.0 and the file no longer exists; kept so a 1.x-era source survey still classifies it EXCLUDED. Removal needs a studio/ decision.
    added: 2026-05-08

  - path: .gaia/cli/src/mentorship/display-rule-memory.ts
    reason: obscurity-by-design (companion to display-rule.ts; same protection rationale)
    added: 2026-05-08

  - path: "**/telemetry/mentorship/events-*.jsonl"
    reason: obscurity-by-design (protected telemetry stream path shape; the path pattern itself signposts what to scrape)
    added: 2026-05-08

  - path: "~/.claude/projects/*/gaia/telemetry/mentorship/**"
    reason: obscurity-by-design (per-user mentorship telemetry directory; user-side path, never document)
    added: 2026-05-08

  - name: _internal-*
    reason: obscurity-by-design (CLI subcommand names beginning with _internal- signal the protected category by their name; surfacing them in docs reveals the protected boundary)
    added: 2026-05-08

  - name: gaia release*
    reason: Steven-only. Release subcommands belong to the maintainer, not to adopters or contributors. Since 2.0.0 the release namespace lives only in the release-excluded .gaia/cli/gaia-maintainer binary, but listing its subcommands is still wrong audience, contributor docs included.
    added: 2026-05-08

  - name: gaia telemetry*
    reason: deferred. The 1.x `gaia telemetry` emit surface is gone from the 2.0.0 adopter binary. The 2.0.0 adoption ping (`gaia ping`) IS documented, as opt-out only, on reference/telemetry.mdx (the three events and the categorical fields each adds) - one fire-and-forget POST to telemetry.gaiareact.com with a few categorical fields, a pseudonymous per-install projectId, the GAIA version and a coarse platform, never paths or free text, disabled by GAIA_TELEMETRY_PING_DISABLE=1. Do not document the server side, the payload beyond that, or how projectId is derived. The local usage ledger (.gaia/local/telemetry/usage.jsonl) is documented separately on reference/cost.mdx and is not covered by this entry.
    added: 2026-05-08
    updated: 2026-10-20

  - path: wiki/concepts/Telemetry.md
    reason: deferred, paired with gaia telemetry* above. The page no longer exists at GAIA 2.0.0; kept for 1.x-era surveys.
    added: 2026-05-08

  - path: .claude/hooks/telemetry-task-postuse.sh
    reason: deferred, paired with gaia telemetry* above. The hook is removed in GAIA 2.0.0; kept for 1.x-era surveys.
    added: 2026-05-08

  - name: gaia mentorship*
    reason: deferred. The mentorship layer and its gaia mentorship verbs are removed in GAIA 2.0.0, so there is no adopter surface left to document; docs mention only that it is gone where the CHANGELOG makes that actionable. Removal of this entry needs a studio/ decision.
    added: 2026-05-08
    updated: 2026-10-20
